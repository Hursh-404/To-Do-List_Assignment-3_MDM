<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">STAY ORGANIZED</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">A simple place to plan your day.</p>
    </header>

    <form id="task-form" class="task-form">
      <input id="task-input" type="text" placeholder="What needs to be done?" autocomplete="off" required>
      <button type="submit" id="submit-button">Add task</button>
    </form>

    <section class="list-section">
      <div class="list-heading">
        <h2>Your tasks</h2>
        <span id="task-count">0 tasks</span>
      </div>
      <ul id="task-list" aria-live="polite"></ul>
      <p id="empty-state">No tasks yet. Add one above to get started.</p>
    </section>
    <footer>Tasks are saved in this browser using local storage.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
